<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<style>

* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
}

/* ===========================
   CONFETTI CSS
   =========================== */
#confettiContainer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 9998;
  overflow: hidden;
}

.confetti-piece {
  position: absolute;
  top: -20px;
  width: 10px;
  height: 14px;
  border-radius: 2px;
  opacity: 0.9;
  animation: confettiFall linear forwards;
}

@keyframes confettiFall {
  0% {
    transform: translateY(0) rotate(0deg) scaleX(1);
    opacity: 1;
  }
  80% {
    opacity: 1;
  }
  100% {
    transform: translateY(110vh) rotate(720deg) scaleX(-1);
    opacity: 0;
  }
}

/* ===========================
   PANEL DE INFORMACIÓN
   =========================== */
#panel {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.97);
  padding: 18px 22px;
  border-radius: 14px;
  display: none;
  z-index: 10000;
  min-width: 280px;
  max-width: 360px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.18);
  text-align: center;
}

#panel h2 {
  margin: 0 0 8px;
  font-size: 1.3rem;
}

#panel p {
  margin: 4px 0;
  font-size: 0.95rem;
  color: #333;
}

#panel button {
  margin: 8px 6px 0;
  padding: 9px 18px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 600;
  transition: transform 0.1s, opacity 0.2s;
}

#panel button:active {
  transform: scale(0.96);
}

#btnAnswer {
  background: #2ecc71;
  color: white;
}

#btnFilter {
  background: #555;
  color: white;
}

#answerBox {
  display: none;
  margin-top: 10px;
  background: #f0f8ff;
  border-left: 4px solid #2ecc71;
  padding: 8px 12px;
  border-radius: 6px;
  font-weight: 700;
  color: #1a6e3a;
  font-size: 1rem;
}

/* ===========================
   VIDEO
   =========================== */
#videoContainer {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  z-index: 9999;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

#videoFrame {
  display: block;
  width: 340px;
  height: 190px;
  border: none;
  transition: filter 0.4s ease;
}

/* Clase que activa el filtro B&N */
#videoFrame.filtroBN {
  filter: grayscale(100%) contrast(1.1);
}

</style>

</head>
<body>

<!-- CONFETTI CONTAINER -->
<div id="confettiContainer"></div>

<!-- PANEL TRIVIA -->
<div id="panel">
  <h2 id="countryTitle"></h2>
  <p><b>Trivia:</b></p>
  <p id="triviaQuestion"></p>
  <div id="answerBox"></div>
  <br>
  <button id="btnAnswer" onclick="showAnswer()">Ver respuesta</button>
  <button id="btnFilter" onclick="toggleFiltro()">🎨 Blanco y Negro</button>
</div>

<!-- VIDEO -->
<div id="videoContainer">
  <iframe
    id="videoFrame"
    src=""
    title="YouTube video"
    frameborder="0"
    allowfullscreen>
  </iframe>
</div>


<!-- ===========================
     ESCENA AR
     =========================== -->
<a-scene embedded arjs>

  <a-assets>
    <img id="mexicoTexture"   src="https://upload.wikimedia.org/wikipedia/commons/f/fc/Flag_of_Mexico.svg">
    <img id="argentinaTexture" src="https://upload.wikimedia.org/wikipedia/commons/1/1a/Flag_of_Argentina.svg">
    <img id="brazilTexture"   src="https://upload.wikimedia.org/wikipedia/en/0/05/Flag_of_Brazil.svg">
    <img id="uruguayTexture"  src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Flag_of_Uruguay.svg">
    <img id="colombiaTexture" src="https://upload.wikimedia.org/wikipedia/commons/2/21/Flag_of_Colombia.svg">
    <img id="ecuadorTexture"  src="https://upload.wikimedia.org/wikipedia/commons/e/e8/Flag_of_Ecuador.svg">
    <img id="usaTexture"      src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg">
    <img id="canadaTexture"   src="https://upload.wikimedia.org/wikipedia/commons/c/cf/Flag_of_Canada.svg">
  </a-assets>

  <!-- MEXICO -->
  <a-marker type="pattern" url="pattern-mx.patt" id="mexicoMarker">
    <a-plane src="#mexicoTexture" position="0 0.5 0" rotation="-90 0 0" width="2" height="1.2"
      animation="property: rotation; to: -90 360 0; loop: true; dur: 6000">
    </a-plane>
  </a-marker>

  <!-- USA -->
  <a-marker type="pattern" url="pattern-us.patt" id="usaMarker">
    <a-plane src="#usaTexture" position="0 0.5 0" rotation="-90 0 0" width="2" height="1.2"
      animation="property: rotation; to: -90 360 0; loop: true; dur: 6000">
    </a-plane>
  </a-marker>

  <!-- CANADA -->
  <a-marker type="pattern" url="pattern-ca.patt" id="canadaMarker">
    <a-plane src="#canadaTexture" position="0 0.5 0" rotation="-90 0 0" width="2" height="1.2"
      animation="property: rotation; to: -90 360 0; loop: true; dur: 6000">
    </a-plane>
  </a-marker>

  <!-- ARGENTINA -->
  <a-marker type="pattern" url="pattern-ar.patt" id="argentinaMarker">
    <a-plane src="#argentinaTexture" position="0 0.5 0" rotation="-90 0 0" width="2" height="1.2"
      animation="property: rotation; to: -90 360 0; loop: true; dur: 6000">
    </a-plane>
  </a-marker>

  <!-- BRASIL -->
  <a-marker type="pattern" url="pattern-br.patt" id="brazilMarker">
    <a-plane src="#brazilTexture" position="0 0.5 0" rotation="-90 0 0" width="2" height="1.2"
      animation="property: rotation; to: -90 360 0; loop: true; dur: 6000">
    </a-plane>
  </a-marker>

  <!-- URUGUAY -->
  <a-marker type="pattern" url="pattern-ur.patt" id="uruguayMarker">
    <a-plane src="#uruguayTexture" position="0 0.5 0" rotation="-90 0 0" width="2" height="1.2"
      animation="property: rotation; to: -90 360 0; loop: true; dur: 6000">
    </a-plane>
  </a-marker>

  <!-- COLOMBIA -->
  <a-marker type="pattern" url="pattern-col.patt" id="colombiaMarker">
    <a-plane src="#colombiaTexture" position="0 0.5 0" rotation="-90 0 0" width="2" height="1.2"
      animation="property: rotation; to: -90 360 0; loop: true; dur: 6000">
    </a-plane>
  </a-marker>

  <!-- ECUADOR -->
  <a-marker type="pattern" url="pattern-ec.patt" id="ecuadorMarker">
    <a-plane src="#ecuadorTexture" position="0 0.5 0" rotation="-90 0 0" width="2" height="1.2"
      animation="property: rotation; to: -90 360 0; loop: true; dur: 6000">
    </a-plane>
  </a-marker>

  <a-entity camera></a-entity>

</a-scene>


<script>

/* ===========================
   ESTADO GLOBAL
   =========================== */
let currentAnswer = ""
let filtroActivo  = false

/* ===========================
   TRIVIA: mostrar respuesta
   =========================== */
function showAnswer() {
  const box = document.getElementById("answerBox")
  box.textContent = "✅ " + currentAnswer
  box.style.display = "block"
}

/* ===========================
   FILTRO BLANCO Y NEGRO
   Aplica/quita grayscale al iframe
   =========================== */
function toggleFiltro() {
  const frame  = document.getElementById("videoFrame")
  const btn    = document.getElementById("btnFilter")
  filtroActivo = !filtroActivo

  if (filtroActivo) {
    frame.classList.add("filtroBN")
    btn.textContent = "🎨 Color"
  } else {
    frame.classList.remove("filtroBN")
    btn.textContent = "🎨 Blanco y Negro"
  }
}

/* ===========================
   CONFETTI PURO EN CSS/JS
   colores: array de strings CSS
   =========================== */
function lanzarConfeti(colores) {
  const container = document.getElementById("confettiContainer")
  const cantidad  = 120

  for (let i = 0; i < cantidad; i++) {
    const piece = document.createElement("div")
    piece.classList.add("confetti-piece")

    // posición horizontal aleatoria
    piece.style.left = Math.random() * 100 + "vw"

    // color aleatorio de la paleta del país
    piece.style.background = colores[Math.floor(Math.random() * colores.length)]

    // duración y delay aleatorios para que no caigan todos igual
    const dur   = (2 + Math.random() * 2).toFixed(2) + "s"
    const delay = (Math.random() * 1.2).toFixed(2) + "s"
    piece.style.animationDuration = dur
    piece.style.animationDelay    = delay

    // tamaño ligeramente variado
    const size = 8 + Math.random() * 8
    piece.style.width  = size + "px"
    piece.style.height = (size * 1.4) + "px"

    container.appendChild(piece)
    // limpiar después de que termine
    setTimeout(() => piece.remove(), (parseFloat(dur) + parseFloat(delay) + 0.5) * 1000)
  }
}

/* ===========================
   HELPERS UI
   =========================== */
function mostrarPais(titulo, pregunta, respuesta, videoSrc, coloresConfeti) {
  const panel = document.getElementById("panel")
  const video = document.getElementById("videoContainer")
  const frame = document.getElementById("videoFrame")

  document.getElementById("countryTitle").innerHTML  = titulo
  document.getElementById("triviaQuestion").innerHTML = pregunta
  document.getElementById("answerBox").style.display = "none"
  currentAnswer = respuesta

  panel.style.display = "block"
  video.style.display = "block"
  frame.src = videoSrc

  lanzarConfeti(coloresConfeti)
}

function ocultarPais() {
  const panel = document.getElementById("panel")
  const video = document.getElementById("videoContainer")
  const frame = document.getElementById("videoFrame")

  panel.style.display = "none"
  video.style.display = "none"
  frame.src = ""

  // reset filtro al perder el marcador
  frame.classList.remove("filtroBN")
  filtroActivo = false
  document.getElementById("btnFilter").textContent = "🎨 Blanco y Negro"
}

/* ===========================
   EVENTOS AR — MARKERS
   =========================== */
window.addEventListener("load", function () {

  /* MÉXICO */
  document.querySelector("#mexicoMarker").addEventListener("markerFound", () =>
    mostrarPais(
      "México 🇲🇽",
      "¿En qué años México fue sede del Mundial?",
      "1970 y 1986",
      "https://www.youtube.com/embed/2uRuPzTkcJg",
      ["#006847","#CE1126","#FFFFFF","#F5A623"]
    )
  )
  document.querySelector("#mexicoMarker").addEventListener("markerLost", ocultarPais)

  /* USA */
  document.querySelector("#usaMarker").addEventListener("markerFound", () =>
    mostrarPais(
      "Estados Unidos 🇺🇸",
      "¿En qué año Estados Unidos fue sede del Mundial?",
      "1994",
      "https://www.youtube.com/embed/gpEH3pZNXok",
      ["#B22234","#3C3B6E","#FFFFFF"]
    )
  )
  document.querySelector("#usaMarker").addEventListener("markerLost", ocultarPais)

  /* CANADÁ */
  document.querySelector("#canadaMarker").addEventListener("markerFound", () =>
    mostrarPais(
      "Canadá 🇨🇦",
      "¿En qué año Canadá participó por primera vez en un Mundial?",
      "1986",
      "https://www.youtube.com/embed/Uu3ow1_fpxY",
      ["#FF0000","#FFFFFF"]
    )
  )
  document.querySelector("#canadaMarker").addEventListener("markerLost", ocultarPais)

  /* ARGENTINA */
  document.querySelector("#argentinaMarker").addEventListener("markerFound", () =>
    mostrarPais(
      "Argentina 🇦🇷",
      "¿Cuántos Mundiales ha ganado Argentina?",
      "3 (1978, 1986 y 2022)",
      "https://www.youtube.com/embed/mC2VgPD0rTQ",
      ["#74ACDF","#FFFFFF","#F6B40E"]
    )
  )
  document.querySelector("#argentinaMarker").addEventListener("markerLost", ocultarPais)

  /* BRASIL */
  document.querySelector("#brazilMarker").addEventListener("markerFound", () =>
    mostrarPais(
      "Brasil 🇧🇷",
      "¿Cuántos Mundiales ha ganado Brasil?",
      "5",
      "https://www.youtube.com/embed/oVLERGbfwvA",
      ["#009C3B","#FFDF00","#002776","#FFFFFF"]
    )
  )
  document.querySelector("#brazilMarker").addEventListener("markerLost", ocultarPais)

  /* URUGUAY */
  document.querySelector("#uruguayMarker").addEventListener("markerFound", () =>
    mostrarPais(
      "Uruguay 🇺🇾",
      "¿En qué años Uruguay ganó el Mundial?",
      "1930 y 1950",
      "https://www.youtube.com/embed/sgcULpc5rVg",
      ["#00A3E0","#FFFFFF","#FFD700"]
    )
  )
  document.querySelector("#uruguayMarker").addEventListener("markerLost", ocultarPais)

  /* COLOMBIA */
  document.querySelector("#colombiaMarker").addEventListener("markerFound", () =>
    mostrarPais(
      "Colombia 🇨🇴",
      "¿Quién es el máximo goleador histórico de Colombia?",
      "Radamel Falcao",
      "https://www.youtube.com/embed/sgcULpc5rVg",
      ["#FFD700","#003087","#CE1126"]
    )
  )
  document.querySelector("#colombiaMarker").addEventListener("markerLost", ocultarPais)

  /* ECUADOR */
  document.querySelector("#ecuadorMarker").addEventListener("markerFound", () =>
    mostrarPais(
      "Ecuador 🇪🇨",
      "¿En qué año Ecuador debutó en un Mundial?",
      "2002",
      "https://www.youtube.com/embed/pRNK68T2IVs",
      ["#FFD100","#003DA5","#EF3340","#FFFFFF"]
    )
  )
  document.querySelector("#ecuadorMarker").addEventListener("markerLost", ocultarPais)

})

</script>

</body>
</html>
