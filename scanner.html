<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<style>

* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
}

/* ===========================
   CONFETTI CSS
   =========================== */
#confettiContainer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 9998;
  overflow: hidden;
}

.confetti-piece {
  position: absolute;
  top: -20px;
  width: 10px;
  height: 14px;
  border-radius: 2px;
  opacity: 0.9;
  animation: confettiFall linear forwards;
}

@keyframes confettiFall {
  0% {
    transform: translateY(0) rotate(0deg) scaleX(1);
    opacity: 1;
  }
  80% {
    opacity: 1;
  }
  100% {
    transform: translateY(110vh) rotate(720deg) scaleX(-1);
    opacity: 0;
  }
}

/* ===========================
   PANEL DE INFORMACIÓN
   =========================== */
#panel {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.97);
  padding: 18px 22px;
  border-radius: 14px;
  display: none;
  z-index: 10000;
  min-width: 300px;
  max-width: 380px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.18);
  text-align: center;
}

#panel h2 {
  margin: 0 0 8px;
  font-size: 1.3rem;
}

#triviaQuestion {
  margin: 4px 0 6px;
  font-size: 0.95rem;
  color: #333;
}

/* Navegación de preguntas */
#triviaNav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 6px 0 4px;
}

#triviaNav button {
  background: #ddd;
  border: none;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 1rem;
  cursor: pointer;
  transition: background 0.2s;
  color: #333;
  font-weight: 700;
}

#triviaNav button:hover {
  background: #bbb;
}

#triviaCounter {
  font-size: 0.8rem;
  color: #888;
  min-width: 40px;
}

#answerBox {
  display: none;
  margin-top: 10px;
  background: #f0f8ff;
  border-left: 4px solid #2ecc71;
  padding: 8px 12px;
  border-radius: 6px;
  font-weight: 700;
  color: #1a6e3a;
  font-size: 1rem;
}

/* Botones de acción */
#actionButtons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  margin-top: 10px;
}

#panel button.action-btn {
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 600;
  transition: transform 0.1s, opacity 0.2s, background 0.2s;
}

#panel button.action-btn:active {
  transform: scale(0.96);
}

#btnAnswer {
  background: #2ecc71;
  color: white;
}

/* Filtros — color base inactivo */
.filter-btn {
  background: #555;
  color: white;
}

/* Filtros — activo */
.filter-btn.active {
  outline: 3px solid #4A90A4;
  outline-offset: 1px;
}

/* ===========================
   VIDEO
   =========================== */
#videoContainer {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  z-index: 9999;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

#videoFrame {
  display: block;
  width: 340px;
  height: 190px;
  border: none;
  transition: filter 0.4s ease;
}

/* ===========================
   FILTROS
   =========================== */
#videoFrame.filtroBN {
  filter: grayscale(100%) contrast(1.1);
}

#videoFrame.filtroDesenfoque {
  filter: blur(4px);
}

#videoFrame.filtroPixelado {
  image-rendering: pixelated;
  filter: contrast(1.1);
  transform: scale(1.01); /* evita borde blanco con pixelado */
}

#videoFrame.filtroAzul {
  filter: sepia(0.3) saturate(1.5) hue-rotate(180deg) brightness(1.05);
}

</style>

</head>
<body>

<!-- CONFETTI CONTAINER -->
<div id="confettiContainer"></div>

<!-- PANEL TRIVIA -->
<div id="panel">
  <h2 id="countryTitle"></h2>

  <p id="triviaQuestion"></p>

  <div id="triviaNav">
    <button onclick="cambiarPregunta(-1)">&#8592;</button>
    <span id="triviaCounter">1 / 5</span>
    <button onclick="cambiarPregunta(1)">&#8594;</button>
  </div>

  <div id="answerBox"></div>

  <div id="actionButtons">
    <button class="action-btn" id="btnAnswer" onclick="showAnswer()">✅ Ver respuesta</button>
    <button class="action-btn filter-btn" id="btnBN"        onclick="toggleFiltro('filtroBN',        this)">⬛ B&amp;N</button>
    <button class="action-btn filter-btn" id="btnDesenfoque" onclick="toggleFiltro('filtroDesenfoque', this)">🌫️ Desenfoque</button>
    <button class="action-btn filter-btn" id="btnPixelado"   onclick="toggleFiltro('filtroPixelado',   this)">🟦 Pixelado</button>
    <button class="action-btn filter-btn" id="btnAzul"       onclick="toggleFiltro('filtroAzul',       this)">🔵 Tono azul</button>
  </div>
</div>

<!-- VIDEO -->
<div id="videoContainer">
  <iframe
    id="videoFrame"
    src=""
    title="YouTube video"
    frameborder="0"
    allowfullscreen>
  </iframe>
</div>


<!-- ===========================
     ESCENA AR
     =========================== -->
<a-scene embedded arjs>

  <a-assets>
    <img id="mexicoTexture"    src="https://upload.wikimedia.org/wikipedia/commons/f/fc/Flag_of_Mexico.svg">
    <img id="argentinaTexture" src="https://upload.wikimedia.org/wikipedia/commons/1/1a/Flag_of_Argentina.svg">
    <img id="brazilTexture"    src="https://upload.wikimedia.org/wikipedia/en/0/05/Flag_of_Brazil.svg">
    <img id="uruguayTexture"   src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Flag_of_Uruguay.svg">
    <img id="colombiaTexture"  src="https://upload.wikimedia.org/wikipedia/commons/2/21/Flag_of_Colombia.svg">
    <img id="ecuadorTexture"   src="https://upload.wikimedia.org/wikipedia/commons/e/e8/Flag_of_Ecuador.svg">
    <img id="usaTexture"       src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg">
    <img id="canadaTexture"    src="https://upload.wikimedia.org/wikipedia/commons/c/cf/Flag_of_Canada.svg">
  </a-assets>

  <!-- MEXICO -->
  <a-marker type="pattern" url="pattern-mx.patt" id="mexicoMarker">
    <a-plane src="#mexicoTexture" position="0 0.5 0" rotation="-90 0 0" width="2" height="1.2"
      animation="property: rotation; to: -90 360 0; loop: true; dur: 6000">
    </a-plane>
  </a-marker>

  <!-- USA -->
  <a-marker type="pattern" url="pattern-us.patt" id="usaMarker">
    <a-plane src="#usaTexture" position="0 0.5 0" rotation="-90 0 0" width="2" height="1.2"
      animation="property: rotation; to: -90 360 0; loop: true; dur: 6000">
    </a-plane>
  </a-marker>

  <!-- CANADA -->
  <a-marker type="pattern" url="pattern-ca.patt" id="canadaMarker">
    <a-plane src="#canadaTexture" position="0 0.5 0" rotation="-90 0 0" width="2" height="1.2"
      animation="property: rotation; to: -90 360 0; loop: true; dur: 6000">
    </a-plane>
  </a-marker>

  <!-- ARGENTINA -->
  <a-marker type="pattern" url="pattern-ar.patt" id="argentinaMarker">
    <a-plane src="#argentinaTexture" position="0 0.5 0" rotation="-90 0 0" width="2" height="1.2"
      animation="property: rotation; to: -90 360 0; loop: true; dur: 6000">
    </a-plane>
  </a-marker>

  <!-- BRASIL -->
  <a-marker type="pattern" url="pattern-br.patt" id="brazilMarker">
    <a-plane src="#brazilTexture" position="0 0.5 0" rotation="-90 0 0" width="2" height="1.2"
      animation="property: rotation; to: -90 360 0; loop: true; dur: 6000">
    </a-plane>
  </a-marker>

  <!-- URUGUAY -->
  <a-marker type="pattern" url="pattern-ur.patt" id="uruguayMarker">
    <a-plane src="#uruguayTexture" position="0 0.5 0" rotation="-90 0 0" width="2" height="1.2"
      animation="property: rotation; to: -90 360 0; loop: true; dur: 6000">
    </a-plane>
  </a-marker>

  <!-- COLOMBIA -->
  <a-marker type="pattern" url="pattern-col.patt" id="colombiaMarker">
    <a-plane src="#colombiaTexture" position="0 0.5 0" rotation="-90 0 0" width="2" height="1.2"
      animation="property: rotation; to: -90 360 0; loop: true; dur: 6000">
    </a-plane>
  </a-marker>

  <!-- ECUADOR -->
  <a-marker type="pattern" url="pattern-ec.patt" id="ecuadorMarker">
    <a-plane src="#ecuadorTexture" position="0 0.5 0" rotation="-90 0 0" width="2" height="1.2"
      animation="property: rotation; to: -90 360 0; loop: true; dur: 6000">
    </a-plane>
  </a-marker>

  <a-entity camera></a-entity>

</a-scene>


<script>

}

/* ===========================
   ESTADO GLOBAL
   =========================== */
let triviaActual   = []   // arreglo de {p, r} del país activo
let preguntaIndex  = 0    // índice de pregunta actual
let filtroActivo   = null // clase CSS del filtro activo

/* ===========================
   NAVEGACIÓN DE PREGUNTAS
   =========================== */
function cambiarPregunta(dir) {
  preguntaIndex = (preguntaIndex + dir + triviaActual.length) % triviaActual.length
  renderPregunta()
}

function renderPregunta() {
  const item = triviaActual[preguntaIndex]
  document.getElementById("triviaQuestion").textContent = item.p
  document.getElementById("triviaCounter").textContent  = (preguntaIndex + 1) + " / " + triviaActual.length
  // ocultar respuesta al cambiar pregunta
  const box = document.getElementById("answerBox")
  box.style.display = "none"
  box.textContent   = ""
}

/* ===========================
   MOSTRAR RESPUESTA
   =========================== */
function showAnswer() {
  const box = document.getElementById("answerBox")
  box.textContent   = "✅ " + triviaActual[preguntaIndex].r
  box.style.display = "block"
}

/* ===========================
   FILTROS — solo uno activo a la vez
   =========================== */
function toggleFiltro(clase, btn) {
  const frame    = document.getElementById("videoFrame")
  const FILTROS  = ["filtroBN","filtroDesenfoque","filtroPixelado","filtroAzul"]
  const eraActivo = filtroActivo === clase

  // quitar todos los filtros y estilos active
  FILTROS.forEach(f => frame.classList.remove(f))
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"))

  if (eraActivo) {
    // segundo clic: apagar filtro
    filtroActivo = null
  } else {
    // activar el nuevo filtro
    frame.classList.add(clase)
    btn.classList.add("active")
    filtroActivo = clase
  }
}

/* ===========================
   CONFETTI
   =========================== */
function lanzarConfeti(colores) {
  const container = document.getElementById("confettiContainer")
  const cantidad  = 120

  for (let i = 0; i < cantidad; i++) {
    const piece = document.createElement("div")
    piece.classList.add("confetti-piece")
    piece.style.left            = Math.random() * 100 + "vw"
    piece.style.background      = colores[Math.floor(Math.random() * colores.length)]
    const dur   = (2 + Math.random() * 2).toFixed(2) + "s"
    const delay = (Math.random() * 1.2).toFixed(2) + "s"
    piece.style.animationDuration = dur
    piece.style.animationDelay    = delay
    const size = 8 + Math.random() * 8
    piece.style.width  = size + "px"
    piece.style.height = (size * 1.4) + "px"
    container.appendChild(piece)
    setTimeout(() => piece.remove(), (parseFloat(dur) + parseFloat(delay) + 0.5) * 1000)
  }
}

/* ===========================
   HELPERS UI
   =========================== */
function mostrarPais(key) {
  const pais  = PAISES[key]
  const panel = document.getElementById("panel")
  const video = document.getElementById("videoContainer")
  const frame = document.getElementById("videoFrame")

  // cargar trivia
  triviaActual  = pais.trivia
  preguntaIndex = 0

  document.getElementById("countryTitle").innerHTML = pais.titulo
  renderPregunta()

  panel.style.display = "block"
  video.style.display = "block"
  frame.src = pais.video

  lanzarConfeti(pais.colores)
}

function ocultarPais() {
  const panel = document.getElementById("panel")
  const video = document.getElementById("videoContainer")
  const frame = document.getElementById("videoFrame")

  panel.style.display = "none"
  video.style.display = "none"
  frame.src = ""

  // reset filtros
  const FILTROS = ["filtroBN","filtroDesenfoque","filtroPixelado","filtroAzul"]
  FILTROS.forEach(f => frame.classList.remove(f))
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"))
  filtroActivo = null
}

/* ===========================
   EVENTOS AR — MARKERS
   =========================== */
window.addEventListener("load", function () {

  document.querySelector("#mexicoMarker").addEventListener("markerFound",   () => mostrarPais("mexico"))
  document.querySelector("#mexicoMarker").addEventListener("markerLost",    ocultarPais)

  document.querySelector("#usaMarker").addEventListener("markerFound",      () => mostrarPais("usa"))
  document.querySelector("#usaMarker").addEventListener("markerLost",       ocultarPais)

  document.querySelector("#canadaMarker").addEventListener("markerFound",   () => mostrarPais("canada"))
  document.querySelector("#canadaMarker").addEventListener("markerLost",    ocultarPais)

  document.querySelector("#argentinaMarker").addEventListener("markerFound",() => mostrarPais("argentina"))
  document.querySelector("#argentinaMarker").addEventListener("markerLost", ocultarPais)

  document.querySelector("#brazilMarker").addEventListener("markerFound",   () => mostrarPais("brasil"))
  document.querySelector("#brazilMarker").addEventListener("markerLost",    ocultarPais)

  document.querySelector("#uruguayMarker").addEventListener("markerFound",  () => mostrarPais("uruguay"))
  document.querySelector("#uruguayMarker").addEventListener("markerLost",   ocultarPais)

  document.querySelector("#colombiaMarker").addEventListener("markerFound", () => mostrarPais("colombia"))
  document.querySelector("#colombiaMarker").addEventListener("markerLost",  ocultarPais)

  document.querySelector("#ecuadorMarker").addEventListener("markerFound",  () => mostrarPais("ecuador"))
  document.querySelector("#ecuadorMarker").addEventListener("markerLost",   ocultarPais)

})

</script>

</body>
</html>
